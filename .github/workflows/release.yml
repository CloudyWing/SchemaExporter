name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\SchemaExporter.slnx

      - name: Build
        run: dotnet build .\SchemaExporter.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\SchemaExporter.slnx -c Release --no-build --verbosity minimal

      - name: Publish app
        run: dotnet publish .\src\SchemaExporter\SchemaExporter.csproj -c Release --self-contained -r win-x64 -o .\artifacts\publish

      - name: Pack Velopack
        uses: CloudyWing/devops-templates/.github/actions/velopack-pack@v1
        with:
          version: ${{ github.ref_name }}
          pack-id: CloudyWing.SchemaExporter
          main-exe: CloudyWing.SchemaExporter.exe
          pack-dir: .\artifacts\publish
          output-dir: .\artifacts\velopack
          # 必須與 SchemaExporter.csproj 引用的 Velopack 套件版本一致
          vpk-version: "0.0.1298"
          # 下載前一版 Release 以產生 delta 更新包
          delta: "true"
          github-token: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack
          path: artifacts/velopack/*

  # 上傳 velopack artifact 為附件；gh 會先建立草稿，附件上傳完成後才公開
  create-release:
    needs: build
    permissions:
      contents: write
    uses: CloudyWing/devops-templates/.github/workflows/reusable-create-release.yml@v1
    with:
      artifact-name: velopack
