name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\SchemaExporter.slnx

      - name: Build
        run: dotnet build .\SchemaExporter.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\SchemaExporter.slnx -c Release --no-build --verbosity minimal

      # Desktop 與 CLI 分別 Publish 到不同資料夾，避免相依檔與 appsettings.json 互相覆寫。
      - name: Publish desktop
        run: dotnet publish .\src\SchemaExporter.Desktop\SchemaExporter.Desktop.csproj -c Release --self-contained -r win-x64 -o .\artifacts\publish\desktop

      - name: Publish CLI
        run: dotnet publish .\src\SchemaExporter.Cli\SchemaExporter.Cli.csproj -c Release --self-contained -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\artifacts\publish\cli

      - name: Stage package
        shell: pwsh
        run: |
          $stage = '.\artifacts\stage'
          New-Item -ItemType Directory -Force -Path "$stage\tools" | Out-Null
          Copy-Item -Path '.\artifacts\publish\desktop\*' -Destination $stage -Recurse
          Copy-Item -Path '.\artifacts\publish\cli\*' -Destination "$stage\tools" -Recurse
          foreach ($required in @("$stage\CloudyWing.SchemaExporter.exe", "$stage\appsettings.json", "$stage\tools\CloudyWing.SchemaExporter.Cli.exe", "$stage\tools\appsettings.json")) {
            if (-not (Test-Path $required)) {
              throw "Missing packaged file: $required"
            }
          }

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'cli-smoke'
          & .\artifacts\stage\tools\CloudyWing.SchemaExporter.Cli.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "CLI --help returned $LASTEXITCODE"
          }

      - name: Zip CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\cli | Out-Null
          Compress-Archive -Path .\artifacts\publish\cli\* -DestinationPath ".\artifacts\cli\CloudyWing.SchemaExporter.Cli-${{ github.ref_name }}-win-x64.zip"

      - name: Pack Velopack
        uses: CloudyWing/devops-templates/.github/actions/velopack-pack@main
        with:
          version: ${{ github.ref_name }}
          pack-id: CloudyWing.SchemaExporter
          main-exe: CloudyWing.SchemaExporter.exe
          pack-dir: .\artifacts\stage
          output-dir: .\artifacts\velopack

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velopack
          path: artifacts/velopack/*

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: artifacts/cli/*

  create-release:
    needs: build
    uses: CloudyWing/devops-templates/.github/workflows/reusable-create-release.yml@main

  upload-release-assets:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: velopack
          path: artifacts/velopack

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: cli
          path: artifacts/cli

      - name: Upload release assets
        run: gh release upload ${{ github.ref_name }} artifacts/velopack/* artifacts/cli/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
